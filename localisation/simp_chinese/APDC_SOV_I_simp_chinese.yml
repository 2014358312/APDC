l_simp_chinese:

  aftermath_of_northern_lights_event_name:0 "北极光的余波"
  aftermath_of_northern_lights_event_desc:0 "占位符"

  gold_ring_plan_name:0 "金环计划"
  gold_ring_plan_desc:0 "“看看这些报告，泽林斯基同志，你知道诺夫哥罗德的情况恶化到什么地步了么？”
    \n别洛夫将统计报表摔在桌上，“现在城市的角落里挤满了难民，每个供暖管上都趴着无家可归者，迟早有一天，城市的公共系统会崩溃的。”
    \n“我以为他们早就崩溃了。”泽林斯基漫不经心的说道。
    \n“我正在阻止这一切发生，泽林斯基同志。面对如此严峻的形势，你怎么能无动于衷呢？”别洛夫对泽林斯基含糊的态度感到不满。
    \n“树挪死，人挪活，别洛夫同志。在可预见的的将来，这些贫民会一股脑的涌进莫斯科、下诺夫哥罗德、喀山、萨马拉、斯大林格勒，直到索契和第比利斯。我们不要理会这些无关紧要的报告，把这些事留给振兴委员会吧。”
    \n“振兴委员会？您可真会开玩笑，你指望一个总部设在顿河畔罗斯托夫的机构管理列宁格勒？”
    \n“好嘛，您知道您不赞成我的意见。“泽林斯基从桌上拿起别洛夫丢出的报告， “我也不想难民危机持续扩大，影响国家的长治久安。所以，别洛夫同志，你有什么建议？”
    \n“看看这张地图。我计划振兴诺夫哥罗德地区的城市，建立收容机构，重建物流中心。未来这些城市将作为重建基地，力争恢复北部地区的生产。”
    \n“哦。”泽林斯基翻动着文件，没有正面回答。
    \n别洛夫担心，泽林斯基会反对他的提案。作为克格勃的首脑，泽林斯基在部长会议中拥有举足轻重的地位，没有一条提议能在泽林斯基的反对下通过。
    \n“别洛夫同志，您的计划非常远大。在原则上，我赞同这份计划，只是，我无法为您的提供更多的帮助，我有更重要的任务需要完成。”
    \n\n评论：你不反对就好。"

  audit_military_supplies_name:0 "清查军用品库存"
  audit_military_supplies_desc:0 "我们的军费节节上涨， 部队报上来的数字也越来越夸张。在莫斯科周围的一个卫戍团居然订购了10000把刺刀。全国各地的库存品积压已经达到了一个非常恐怖的数字，我们无能为力，只能从首都开始调查。"

  investigate_consumer_goods_network_name:0 "调查莫斯科消费品网络"
  investigate_consumer_goods_network_desc:0 "当前，莫斯科面临消费品短缺，人们在商店前面排起长龙，黑市经济空前繁荣。但是，中央下拨的补贴连年增长，账面的数字已经无法对上。是时候查查这笔烂账了"

  crackdown_military_vehicle_abuse_name:0 "严查军车私用"
  crackdown_military_vehicle_abuse_desc:0 "第三次世界大战爆发以来，无数企业被划拨军队管理，发放军用车牌，使用军队营地。战争结束后，这些车牌并没有被回收，仍然在大规模使用。"

  investigate_misappropriated_funds_name:0 "调查挪用专款去向"
  investigate_misappropriated_funds_desc:0 "在水电供暖方面，我们有专项资金拨款。但是相关的建设速度却远远落后于计划，我们想知道，钱都去哪了？"

  recover_military_tax_arrears_name:0 "追缴军属企业税款"
  recover_military_tax_arrears_desc:0 "我们给予后勤部门权利，允许他们生产军民两用产品，比如罐头，小家电之类的。多年以来，这些企业从未向州政府纳税，所有的货品，“百分之百“的被军队内部消化了。是时候叩响他们的大门，让他们出出血了。"

  inspect_light_industrial_goods_name:0 "抽检轻工业品"
  inspect_light_industrial_goods_desc:0 "肥皂、手套、织物，这些都是生活必需品。每个五年计划，我们都以提升商品质量，追求物美价廉为目标进行。每次大会的时候，轻工业部长都拍着胸脯说任务超额完成。但事实又是如何？"

  reclaim_military_occupied_land_name:0 "回收军方侵占土地"
  reclaim_military_occupied_land_desc:0 "军队真会选地方。空降师的训练场地选在一片优美的河岸，周围建设了数个钓鱼小屋，真是一片天赐福地。这样的地方还有不少，部队的大院选在市中心的黄金位置，周围修满了高端场所；邻近城市的工业区也插上了军队的牌子，军队成为了物业。他们赚了个盆满钵满，也该吐出来一点了。"

  monopolize_luxury_goods_name:0 "垄断奢侈品流通"
  monopolize_luxury_goods_desc:0 "对于苏联官僚来说，进口的珠宝首饰，乌拉尔山外的皮草，高加索的红酒，是生活的不可或缺的一部分。我们无法阻止他们追求富足的生活，但至少，我们应该对这些商品进行管控。"

  corruption_invincible_lady_name:0 "腐败：战无不胜的女士"
  corruption_invincible_lady_desc:0 "占位符"

  silver_ring_plan_name:0 "银环计划"
  silver_ring_plan_desc:0 "“我不明⽩别洛夫同志到底想⼲什么？”泽林斯基翻阅着⼀份报告，“这简直就是⼀堆废纸，我当然知道北⽅形势危如累卵，但这不是我们⾸要考虑的。”泽林斯基看向坐在旁边的莫斯科市⻓。 
    \n“您说的不错，在危急关头，我们应该将所有资源集中于莫斯科，⼀切为⾸都服务。”莫斯科市⻓拧开伏特加，给泽林斯基倒上⼀杯，“我相信中央会作出明智的判断，以中央州的利益优先。” 
    \n“说到中央，总统命令我牵头成⽴⼀个巡回稽查组。”泽林斯基接过莫斯科市⻓的酒杯， 
    \n“就在中央州巡视。” 
    \n“哦？这倒是新鲜。”莫斯科市⻓挨着泽林斯基坐下，“⽅便透露⼀下⼯作细节么？” 
    \n“打打苍蝇，修修基建，如此⽽已。”泽林斯基与市⻓碰杯，“你知道的，那些转业⼲部整天不务正业，就知道拉帮结派，是该整治⼀下了。” 
    \n“你是有⼿段的，那些转业⼲部挂着勋章，仗着军队关系横向霸道，我可不敢惹他们。” 
    \n“你说的没错，所以这件事必须由我来办，必要的时候可以动⽤⼀些⾮常⼿段。”泽林斯基把杯中的伏特加⼀饮⽽尽，“⽼古董们其实好对付，真正麻烦的，还是那群流离失所的难⺠。” 
    \n“难⺠有什么好怕的，把他们赶⾛就好了。怎么？你想说光脚的不怕穿鞋的？”莫斯科市⻓被⾃⼰的话逗笑了，连着咳嗽了好⼏下。 
    \n“你站在⼲岸上，⾃然不⽤考虑那么多了。你想想，难⺠被轰出莫斯科后，他们会去哪⾥？弗拉基⽶尔、科斯特罗⻢、梁赞、雅罗斯拉夫。”泽林斯基⼀脸严肃的看着莫斯科市⻓。 
    \n“哈哈哈……泽林斯基同志你误会了，我怎么会把难⺠都赶出去呢？那不过是句玩笑话。好吧，您有什么计划？” 
    \n“就像我之前说的，打打苍蝇，修修基建，⾄少在⾯⼦上过得去。我虽然⽆法控制难⺠的规模，但可以限制难⺠造成的社会影响。”泽林斯基耸耸肩。 
    \n市⻓那过酒瓶，把空杯⼦注满：“根本问题，还是难⺠吗？”市⻓瞥了⼀眼桌上的报告 
    \n——《俄罗斯银环计划》，他看过这篇报告，⾥⾯讲述了以诺夫哥罗德为核⼼，收容难⺠的计划。
    \n“这么说，在难⺠问题上，您和别洛夫同志是⼀致的，你不反对他的计划啰？” 
    \n“我不反对，甚⾄在原则上，我是⽀持的。”泽林斯基拿起酒杯，“但我没有多余的⼒量去⽀援北⽅的建设，⼀切以莫斯科优先，⼲杯！” 
    \n\n评论：敬我们的事业，⼲杯！"

  medical_relief_team_name:0 "医疗援助队"
  medical_relief_team_desc:0 "经过一轮激烈的线上会议，别洛夫气呼呼的从通讯室里走出来。结果如马卡洛夫所料，十项提议中只有四项通过，中央对西北振兴持怀疑态度，别洛夫需要作出一些成绩，才能争取到更多的资源。
    \n“您打算从哪个领域着手？“马卡洛夫问道。
    \n“嗯.....或许从医疗领域开始是最快的。“别洛夫摸着下巴， “我们可以让紧急情况部的医生进驻普斯科夫，不是吗？“
    \n“我们可以让普斯科夫市委书记宣布紧急情况，然后派遣救护队进入普斯科夫。“马卡洛夫翻阅着资料，“需要注意的是，使用紧急情况部会削弱我们的抗风险能力。另外，紧急情况部医疗队规模有限，不足以覆盖普斯科夫地区的医疗缺口。“
    \n“不要紧，医务人员的空缺可以从卫生部长那里争取。再说，我们现在面临的不只有医疗资源的缺乏，医疗设备和住院病房同样短缺“，别洛夫拿过马卡洛夫手中的平板，“紧急情况部不只有医生，还有工程部队和守卫部队。“
    \n“我看看啊......你把中央邦的紧急情况部调到普斯科夫来，然后帮我草拟一份紧急预算案，让紧急情况部拥有更大的活动空间。“别洛夫把平板还给马卡洛夫。
    \n“我明白了。“马卡洛夫翻阅着资料，“别洛夫同志，我这里有一项提议想跟您商讨。“
    \n“说吧，我现在有空。“
    \n“VSK-94告诉我，普斯科夫市为了弥补医疗缺口，雇佣了很多来自波罗的海和德意志的医务人员。这些人大多受过专业的医疗培训，但没有得到卫生部门的认可，属于非法行医。“
    \n“......没有得到苏联官方的认可，这是一个程序性问题“，别洛夫停了一下，“我知道了，我会和卫生部长谈谈的。“
    \n\n评论：感谢您！别洛夫同志。"

  logistics_reform_name:0 "物流革新"
  logistics_reform_desc:0 "“妈的，MP-448在阴阳怪气什么？“在会议的间隙，别洛夫掰着僵硬的手指，来回踱步道。
    \n“......大概是她的发言排在最后，她有些情绪吧。“ 马卡洛夫使了个眼色，示意隔墙有耳。
    \n“啧，什么狗屁玩意儿。“别洛夫摆了摆手，又回到会议室。
    \n会议结束后，一场声势浩大的接风活动拉开帷幕。在吃完晚宴，喝光红酒，蒸完桑拿，官员们邀请别洛夫下榻沃洛格达酒店，但别洛夫拒绝了，坚持回到自己的专列休息。回到列车后，别洛夫并没有休息，而是拉着马卡洛夫下国际象棋。马卡洛夫通过秘密通讯频道发送讯息，邀请MP-448一小时后登上专列。
    \n一小时后，MP-448从车底的暗门钻了进来，她身上全是煤渣和灰烬，马卡洛夫刚想帮她脱掉外套，MP-448已经单刀直入，开始陈述自己的观点。
    \n简单来说，MP-448认为沃洛格达物流效率太低。作为链接乌拉尔与彼得格勒的铁路，每天都会出现拥堵；而链接阿尔汉格尔斯克的高速公路，因为缺乏扫雪机而几度停摆。为此，MP-448制定了一系列交通革新计划，快速提升沃洛格达的物流效率。
    \n“随着天气回暖，积雪已不再构成阻碍，按我的计划执行，我预计物流效率将提高23%。“MP-448信誓旦旦的说道。
    \n别洛夫强撑着困意，快速过了一遍MP-448的计划。“很好，我们按照一个计划试行一周，如果效果好，这个经验可以在全国推广。“
    \nMP-448向别洛夫敬礼，从车厢的暗门钻了回去。
    \n“你的妹妹还是一如既往的可靠呢。“别洛夫打着哈欠，朝卧室走去。
    \n\n评论：一周以后，沃洛格达的运输效率提升了32%"

  refugee_id_verification_name:0 "难民身份证明"
  refugee_id_verification_desc:0 "“您不能这样苛责托卡列夫，她干得不错。“ 
    \n“我知道，我知道，但我必须给官员们一个下马威，他们还以为我是来伊尔门湖度假呢。“别洛夫坐在公园的长椅上，嗑着纸筒里的葵花籽，“再说了，你在我面前护犊子干嘛？你知道我又不会处罚他。“
    \n“我知道。托卡列夫同志是个软心肠，她不怎么敢得罪人。“ 
    \n“得罪人是门艺术，马卡洛夫同志“，别洛夫把装满葵花籽的纸筒揉成一团，投进几米开外的垃圾桶，“我来作出决策，你们来执行，事情就会顺利，明白吗？“
    \n“我明白，别洛夫同志。“
    \n托卡列夫面临的窘境，马卡洛夫再清楚不过了， 在汇报中，托卡列夫写道：“警察局不愿意对难民进行登记，他们辩解道：‘流动人口不归本市警局的管辖‘。我理解他们的苦衷，在诺夫哥罗德，难民和本地居民的人数不相上下，公共机构不堪重负。但我必须指出，对难民进行登记是解决难民危机的唯一途径，只有这样，中央才能合理调度资源，解决难民危机。“
    \n“对难民进行登记“，这个提案事实上在5年前就已经通过了，执行情况却不尽如人意，这是一件吃力不讨好的事情，没有人愿意做，现在也一样。
    \n不过马卡洛夫觉得，这件事也不一定要靠人来做，现在人形们驻扎在北方州各地，她们可以完成这项工作。
    \n\n评论：别洛夫同志，还记得《难民身份登记》提案吗？"

  spirit_of_leningrad_name:0 "重申列宁格勒精神"
  spirit_of_leningrad_desc:0 "占位符"

  auction_leningrad_production_name:0 "拍卖列宁格勒生产指标"
  auction_leningrad_production_desc:0 "经过一系列实地调研后，波波莎给出了一组数据，马卡洛夫粗略的扫了一眼，没有一项数据达到标准。列宁格勒的工业衰退触目惊心，更令人愤怒的，是列宁格勒官员虚报数据，尸位素餐。
    \n面对眼前的一本烂帐，别洛夫感到愤慨，只是介于眼前的危局，别洛夫不能破除列宁格勒错综复杂的利益关系网，他必须利用这些虚报的数据，换取更急需的东西。
    \n“唉，瘦死的骆驼比马大。即使每年无法交付商品，列宁格勒的企业依然能从中央拿到订单。“别洛夫翻阅着报告，“虽然没有生产出合格的商品，中央的补贴这些国企可没少拿。“
    \n“如果列宁格勒能及早振作起来，凭借这些订单，列宁格勒能重回巅峰。“马卡洛夫评价道。
    \n“现在是时候应用这些资源了。“别洛夫深吸一口气，“对于列宁格勒来说，未交付的订单是一个严重的漏洞；但是对于其他城市而言，这是不可多得的订单。我们可以订单卖个好价钱。“
    \n“嗯.......“马卡洛夫陷入了沉思。
    \n“怎么了，马卡洛夫？“别洛夫问道。
    \n“长官，我......我只是想不明白，为什么列宁格勒不出售这些订单？“
    \n“这很容易解释，他们缺少一个合适的仲裁人。“别洛夫回答道。
    \n“这样做，会给您带来极大的不利影响，长官，我认为这......“
    \n“我知道，我们必须小心行事——这是必要之恶。“别洛夫深吸一口气。
    \n\n评论：利用我们的资源，去探探各工业城的意向。"

  leningrad_reconstruction_committee_name:0 "列宁格勒振兴委员会"
  leningrad_reconstruction_committee_desc:0 "6个月后，别洛夫拿到了第一笔汇款。有了这笔钱，别洛夫才能放开手脚，快速重组破产公司，重新分配资源。
    \n马卡洛夫给别洛夫端来一杯咖啡， 别洛夫接过咖啡，表示感谢，忽然他想起来一件事：“诶，最近怎么没见到波波莎呢？“
    \n“波波莎同志正在维堡，实地考察卡累利阿隔离墙的建设情况。“
    \n“这样呀，辛苦她了。“别洛夫喝了一口咖啡，“我们在这里辛苦工作，而列宁格勒的官员们却在南方休假，真是讽刺呀。“
    \n“这次疗养休假，不是您帮忙安排的么？“
    \n“没错，为了交易的顺利进行，我必须安抚列宁格勒的官员，给他们一些甜头。把他们送走，我们就能在列宁格勒安心完成工作，当然，这群官员离开的时候，脸上可没有一点感激之情，这一切好像是他们应得的，是对他们‘辛苦工作‘和‘受损利益‘的补偿。“
    \n别洛夫从桌案上拿起资料，递给马卡洛夫，“现在我们要做的，是建立一个受第三方监管的基金会，确保这些官员们无法挪用这笔资金。“
    \n马卡洛夫翻阅着资料，这份资料写的非常详尽，完美符合新苏联现行体制，不像是最近赶工出来的，看来别洛夫很早就在筹划相关事宜。
    \n“这是一份完美的议案，祝贺长官。“马卡洛夫将议案放回桌上。
    \n“我知道“，别洛夫自信的笑了起来，“等官员们回来，他们一定会惊讶的发现，我手里多了一张底牌。“
    \n\n评论：现在，在财政问题上我们拥有更大的主动权。"

  support_autonomous_communities_name:0 "支持自治社区"
  support_autonomous_communities_desc:0 "“......事实上，警察与当地社区达成了君子协议，双方井水不犯河水，维持着表面上的平衡。“马卡洛夫完成了她的报告，她深吸一口气，等待别洛夫的批评。
    \n“听上去很合理。“出乎马卡洛夫的意料，别洛夫的反应相当平淡。
    \n“您支持当地警察的做法？“
    \n“从工作效率来讲，这样做无可厚非“，别洛夫转动着手中的电子笔，“现在整个列宁格勒处于资源紧张状态，我很欣赏他们能用最少的成本换来最好的效果。不过，既然你提出这个问题，我们确实该进行规范化管理，把协议落到纸上。相关统计数据呢？“
    \n“这里，同志“，马卡洛夫将文件投影到墙上，“目前列宁格勒有近百个活跃的民间社会组织，他们的目标宗旨五花八门，但大概可以分为三类，以下岗工人和难民组成的流民群体；以左翼学生为主体的左翼社团；以退伍老兵为核心的黑帮组织。他们通过非法手段获取资金，同时也填补了社会权利的真空；他们与警察关系暧昧，三方之间存在合作与竞争关系。“
    \n“马卡洛夫同志，你也是老警察了，具体怎么去做不需要我多讲“，别洛夫示意马卡洛夫坐下，“当前经济建设是列宁格勒的主议题，保障治安是必需的，我们可以采取一些非常手段，但有一些原则必须遵守。“
    \n“我明白，我会采取萝卜加大棒战略，打击一切暴力犯罪，引导他们洗白。“马卡洛夫在笔记本上做着记录，“在必要时，我会集中力量，剿灭黄赌毒等一系列恶性犯罪。“
    \n“你去谈谈看，如果谈得好，说不定会有意外惊喜。“别洛夫从办公椅上站起，活动活动筋骨。
    \n评论：得道多助，失道寡助"

  militia_patrol_name:0 "民兵纠察队"
  militia_patrol_desc:0 "别洛夫站在街区的阳台上，检阅着民兵纠察队。这是一支由退伍老兵和预备役人员组成的队伍，他们的工作是维护社区治安，汇报突发情况，预防有组织犯罪。
    \n名义上，这些民兵是一群“志愿者“，不领取任何报酬，只能配合警察和人形部队展开行动。实际操作起来，别洛夫会选择睁一只眼闭一只眼，放任民兵们以权谋私，大鱼吃小鱼。
    \n黑市贸易是别洛夫特意为民兵们开得口子，他们可以从中获得经费，但贸易商品仅限于大宗商品和少量奢侈品。相对于“黄赌毒“这类恶性犯罪，黑市的危害相对小，而且在经济崩溃的当下，别洛夫也不可能禁止黑市，只好监管起来，把黑市的影响控制在有限范围内。
    \n面对这支处于“灰色地带“的部队，马卡洛夫无话可说，权力是厌恶真空的，既然列宁格勒没有足够的警力，那么“社团“就会茁壮成长。马卡洛夫只能筑起高高的树篱，忽视“恶之花“的存在。
    \n马卡洛夫漫步在列宁格勒的黑市中，看着玲琅满目的商品，思考着自己还能做些什么。忽然，一个脏兮兮的手拉住了马卡洛夫的衣袖：“长官，带我走吧，我愿为你扫除一切障碍，只求您给我买一份烤冷面。“人形指着旁边朝鲜人的露天摊，嘴角流下了口水。
    \n马卡洛夫只觉得这个人形眼熟，却想不起在哪见过，她快速扫描了这位人形，却发现她根本没有不是新苏联制造的人形。这件事引起了马卡洛夫的兴趣，她把人形带回安全屋，通过自己的情报网调查人形的身份。
    \n一小时后，AK-5冲了进来，紧紧的抱住这个人形，哭泣着说道：“CM-S，可算找到你了。“
    \n\n评论：看来有必要调查黑市里人形的来历。"

  go_to_the_countryside_name:0 "上山下乡运动"
  go_to_the_countryside_desc:0 "马卡洛夫把酒吧里发生的故事讲给别洛夫，别洛夫笑得前仰后合：“年轻人有个性是件好事，但是老天，我真希望去酒吧的人是我。“
    \n“说实话，这群大学生干得不错，对得起先锋队的名号。他们用有限的的经费，维持着理工科的正常运转。“马卡洛夫摆弄着一个小方块，这是一种新型低温超导材料，是昨天社团联谊会的纪念品，“他们还开了不少企业，小赚了一波。“
    \n“是个好事呀，“别洛夫笑了，转动旋转座椅，“那这些企业有营业执照吗？“
    \n“很遗憾，在过去十五年时间里，没有一家企业申报税款，在网上我们甚至找不到这些企业，他们只接受‘私人订制‘。“
    \n“即使他们真的办理了经营执照，他们也赚不到多少钱“，别洛夫把脚搁在办公桌上，“列宁格勒经济情况这么差，订单都被国企截胡了，小企业根本开不下去。“
    \n“不止如此，这些小企业还吸纳了不少就业，那些不上不下，就无权无势的大学生们，大多也在其中就职。我认为，这些小企业已经成为了列宁格勒不可分割的一部分。“
    \n“我们当然要支持这些企业“，别洛夫把手搁在下巴上，“但是这些企业产能实在有限，不足以快速振兴经济，我必须把资源集中在大企业上。“
    \n“关于这一点，列宁格勒的学生们有一个提议“，马卡洛夫把一份文件放在办公桌上，“他们希望参加列宁格勒的招标集采，用市场的方式获得订单。“
    \n“这样的提议我是可以满足的“，别洛夫翻看着资料，“不过有一个问题，他们这种非正规企业，根本没有参加竞标的资格呀？“
    \n“关于这点，法律系的社团起草了一份提议：列宁格勒的小企业回去收购北方州破产的乡镇企业，实现‘借壳上市‘，您觉得如何？“
    \n\n评论：这个方法好，但是一部分生产产能必须转移到下面县市。"

  women_union_special_office_name:0 "妇联特别办事处"
  women_union_special_office_desc:0 "“.....设置妇联办公室，谈了半天就得到这么个成果？“别洛夫对手中报告表示震惊，“就这点成果你也好意思上报？“
    \n“呃，虽然难以启齿，这是我们能达成的最大共识了。在薪资待遇、工人福利方面，企业经理和难民代表双方互不相让，在经济走上正轨之前，这样的矛盾会持续很长时间。“马卡洛夫解释道。
    \n“平心而论，各工厂开出的薪资虽达不到最低时薪标准，但是维持温饱还是不成问题的。真正需要帮助的，是那些无法参加工作的妇女儿童。调查显示，在‘北极光‘事件出生的儿童中，只有46%完成了小学教育.......“
    \n“不用念了，你的意思我大概了解“，别洛夫打断了马卡洛夫的发言，“开展救济工作从来都是麻烦事，你们有一个大概的计划吗？“
    \n“具体实施的话，我们需要与当地组织合作，完成基础的登记；同时建设独立的检举平台，欢迎群众监督。“马卡洛夫翻着材料。
    \n“这个计划听起来就不靠谱。“别洛夫吐槽道。
    \n“当然不是真的让普通区群众监督，那些左翼大学生、退伍军人组成的自治社团，都是可以利用的资源，让他们互相牵制，可以最大程度的减少损失。“马卡洛夫回答道，“只是这些内容不能放在报告里。“
    \n“这些内容当然不能放在报告里，但是没有这些内容，这些报告是不完整的。“别洛夫深吸一口气，“这样，你把该补全的内容补全，就按照正常流程走，把配套机构这些的都安排上。“
    \n“这样设置会不会太臃肿了？“
    \n“没关系，你先把岗位安排上，到时候员工们身兼数职，挂职工作，到时候工资也能多发一点。“
    \n\n评论：世界是个巨大的草台班子"

  worker_peasant_soldier_unity_name:0 "工农兵大团结"
  worker_peasant_soldier_unity_desc:0 "一切尘埃落定，马卡洛夫得到了喘息的机会。
  \n就个人而言，马卡洛夫不喜欢与社会团体谈判，她认为这无异于监守自盗，触碰了作为警察的底线。但是，身处莫斯科中央的马卡洛夫明白，一切底线，都被中央这个强大黑洞扭曲了，在绝对的权力面前，个人的操守又算得了什么呢？
  \n又到了十月革命纪念日，人们拿出尘封的红旗和标语，走在街上，庆祝一百多年前的胜利。马卡洛夫和9A-91、 AS Val坐在靠窗的阁楼里，看着游行队伍缓缓向前。
  \n“真壮观，不是吗？“9A-91看着窗外的游行队伍。
  \nAS Val忙着消灭桌上的曲奇，没有回应9A-91，而马卡洛夫端着红茶，没有说话。
  \n“怎么了，马卡洛夫同志，有什么不对吗？“9A-91问道。
  \n“ 为了得到他们的支持，我们作出了相当大的让步，以后的工作会很难做。“马卡洛夫低声说道。
  \n“以后的事情以后再担心了。“在吃曲奇的间隙，AS Val挤出了一句话，“列宁格勒的事情，是注定要发生的，我们阻止不了。“
  \n“我想你说的是对的“，马卡洛夫叹了一口气，“我们必须接受温和的改革，避免出现最坏的结局。但是我不会放任他们野蛮生长，我会修剪枝叶，把他们控制在......“
  \n马卡洛夫停住了，她也不知道如何处理列宁格勒的局面。沉默良久，9A-91开口说道：“长官，我觉得没必要感到忧郁，这是列宁格勒的选择，也是人民的选择。换个角度看，我们在列宁格勒团结了多数人，真正实现了工农兵大团结。
  \n“工农兵大团结？马卡洛夫认为这个说法很可笑，但很快她意识到9A-91的说法不无道理。站在中央官员的立场上，自己天然与列宁格勒群众对立；但是站在列宁格勒群众的立场上，自己所行之事皆为正义。
  \n\n评论：那好吧，我们拭目以待"

  death_not_proletariat_name:0 "死亡，不属于工人阶级"
  death_not_proletariat_desc:0 "占位符"

  military_and_bureaucracy_name:0 "军队与官僚"
  military_and_bureaucracy_desc:0 "对于主席来说，别洛夫在北方州获得的成功属于意料之外，看来在重压之下官僚愿意作出改变。但是，主席真正在乎的，还是由泽林斯基推动的内部整肃工作。毫无疑问，两人大胆的行动撼动了腐朽的体系，如何确保改革一以贯之，是主席要考虑的问题。"

  consolidate_gold_ring_achievements_name:0 "巩固金环计划成果"
  consolidate_gold_ring_achievements_desc:0 "在特定地区雷厉风行推行政策，对于一个集权的中央政府来说并不难。但如何刀锋向内，进行自上而下的改革？这个问题一直困扰着主席。
  \n苏联进行了三场战争，每一场都是大获全胜，每一场都重塑国家体系。整个国家已经被绑上了扩张的战车，所有部门都为了军队服务，经济发展陷入停滞，人民生活水平止步不前。
  \n国家需要改革，总有人要拉动火车的刹车。"

  establish_logistics_coordination_committee_name:0 "成立后勤协调委员会"
  establish_logistics_coordination_committee_desc:0 "军队从来是一个独立体系，从装备生产到安置退伍老兵，军队的一切事务由国防部决定。国防部的唯一工作就是确保：“战必应，战必胜。“从这个角度来说，国防部忠实的完成了使命。
  \n但是，过去二十年的先军策略造成了一系列问题，过度扩张的军队规模榨干了苏联青年，同时退伍士兵的安置也成为了沉重负担；国家经济因为军费开支陷入停滞，而军队大批订单又破坏了商品经济。
  \n主席认为，有必要对削减军队规模与预算，将资源分配给更有活力的经济部门。但这一切，必须慢慢改变，避免出现社会动荡。"

  appease_military_dissatisfaction_name:0 "安抚军队不满情绪"
  appease_military_dissatisfaction_desc:0 "占位符"

  assign_officers_to_state_owned_name:0 "向国企派驻官员"
  assign_officers_to_state_owned_desc:0 "泽林斯基相信，只有强力的监管，将一切置于自己的掌控之中，才能将苏联拉出腐化堕落的深渊。
  \n诚然，苏联存在系统性的腐败，其规模和影响空前绝后，单靠克格勃进行自上而下的改革，是不可能的。但是，腐败本身也是一种秩序，是对现有体系空白的补充。
  \n泽林斯基希望，自己能控制这股力量，在自己超然于外的基础上，成为腐败系统的受益人。为此，他作出决定，向各个企业派驻克格勃人形。"

  consensus_on_market_economy_name:0 "就市场经济的几点共识"
  consensus_on_market_economy_desc:0 "占位符"

  appoint_inspectors_name:0 "选调检查官"
  appoint_inspectors_desc:0 "原则上来讲，国家安全局并不负责起诉官员，打击腐败，监控经济活动。但是作为国家重要的情报机关，契卡的继任者，克格勃对国内事务的干预已经形成惯例。
  \n目前对于主席来说，扩大克格勃权力，给予他们诉讼官员的权力，是完成改革重要的一步。这样，克格勃在执行任务时，就不必受制于漫长的司法流程，可以给予腐败官员最直接的打击。"

  establish_economic_corruption_office_name:0 "设置经济腐败办事处"
  establish_economic_corruption_office_desc:0 "占位符"

  promote_silver_ring_scheme_name:0 "推广银环计划方案"
  promote_silver_ring_scheme_desc:0 "银环计划的成功实属预料之外，主席对别洛夫的表现赞赏有加。但只有稍加研究，就会发现银环计划本身漏洞百出，并不适合在全国推广。主席决定开展一系列宣传活动，在雪藏之前物尽其用，为来年的苏共代表大会打下基础。"

  launch_nationwide_discussion_name:0 "开展全国大讨论"
  launch_nationwide_discussion_desc:0 "在主席的指示下，各路媒体的火力全开，开始了大张旗鼓的宣传，引发了全国大讨论。主席知道，银环计划的种种政策经不起考验，就结果来说，这套方案取得了不错的成效，功大于过，所有人不得不承认这点。更重要的是，这次全国大讨论给力人们一种言论自由的错觉，好像他们真的成为了国家的主人。这样的发展，有利于来年苏共代表大会的顺利举办。"

  share_success_stories_name:0 "宣讲成功经验"
    share_success_stories_desc:0 "在主席的安排下，别洛夫被邀请到各个大学，公共场所进行报告。别洛夫认为这是一个推广银环计划成功经验的好机会，但是很多报告还没有完成，于是，别洛夫决定带着人形进行演讲，分享第一手资料。"

  thunderous_but_feeble_reform_name:0 "“雷声大，雨点小”的改革"
  thunderous_but_feeble_reform_desc:0 "主席作出重要批示，高度赞扬了别洛夫在列宁格勒的工作，宣布联邦北部的重建工作已经初见成效，为未来经济发展打下重要基础。\n针对全国大讨论中暴露的问题，主席表示银环计划是特殊环境下的产物，在非常时期使用非常手段是可以接受的。为了维护党内纪律，主席表示，在下一个五年计划里不会再有这样的单列计划。"
