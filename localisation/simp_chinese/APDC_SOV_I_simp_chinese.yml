l_simp_chinese:

  aftermath_of_northern_lights_event_name:0 "北极光的余晖"
  aftermath_of_northern_lights_event_desc:0 "北极光的余晖太过耀眼，在俄罗斯的北方留下了一道难以愈合，持续灼烧的伤疤 ，腐败的脓水正向俄罗斯的心脏前进，如果再不做点什么，这个国家的经济中心会在坍塌污染的缓慢侵蚀中一个一个沦陷。"

  gold_ring_plan_name:0 "金环计划"
  gold_ring_plan_desc:0 "克格勃局长认为，目前中央的资源有限，没有多余的力量支持北方，但可以在首都尽量降低难民潮的影响，通过整肃首都圈的经济秩序，限制军队权力，以及多个基建工程，这样既可以让莫斯科成为生态灾难治理中坚固的后盾，又符合总书记近些年的政治方针。"

  audit_military_supplies_name:0 "清查军用品库存"
  audit_military_supplies_desc:0 "我们的军费节节上涨， 部队报上来的数字也越来越夸张。在莫斯科周围的一个卫戍团居然订购了10000把刺刀。全国各地的库存品积压已经达到了一个非常恐怖的数字，我们无能为力，只能从首都开始调查。"

  investigate_consumer_goods_network_name:0 "调查莫斯科消费品网络"
  investigate_consumer_goods_network_desc:0 "当前，莫斯科面临消费品短缺，人们在商店前面排起长龙，黑市经济空前繁荣。但是，中央下拨的补贴连年增长，账面的数字已经无法对上。是时候查查这笔烂账了"

  crackdown_military_vehicle_abuse_name:0 "严查军车私用"
  crackdown_military_vehicle_abuse_desc:0 "第三次世界大战爆发以来，无数企业被划拨军队管理，发放军用车牌，使用军队营地。战争结束后，这些车牌并没有被回收，仍然在大规模使用。"

  investigate_misappropriated_funds_name:0 "调查挪用专款去向"
  investigate_misappropriated_funds_desc:0 "在水电供暖方面，我们有专项资金拨款。但是相关的建设速度却远远落后于计划，我们想知道，钱都去哪了？"

  recover_military_tax_arrears_name:0 "追缴军属企业税款"
  recover_military_tax_arrears_desc:0 "我们给予后勤部门权利，允许他们生产军民两用产品，比如罐头，小家电之类的。多年以来，这些企业从未向州政府纳税，所有的货品，“百分之百“的被军队内部消化了。是时候叩响他们的大门，让他们出出血了。"

  inspect_light_industrial_goods_name:0 "抽检轻工业品"
  inspect_light_industrial_goods_desc:0 "肥皂、手套、织物，这些都是生活必需品。每个五年计划，我们都以提升商品质量，追求物美价廉为目标进行。每次大会的时候，轻工业部长都拍着胸脯说任务超额完成。但事实又是如何？"

  reclaim_military_occupied_land_name:0 "回收军方侵占土地"
  reclaim_military_occupied_land_desc:0 "军队真会选地方。空降师的训练场地选在一片优美的河岸，周围建设了数个钓鱼小屋，真是一片天赐福地。这样的地方还有不少，部队的大院选在市中心的黄金位置，周围修满了高端场所；邻近城市的工业区也插上了军队的牌子，军队成为了物业。他们赚了个盆满钵满，也该吐出来一点了。"

  monopolize_luxury_goods_name:0 "垄断奢侈品流通"
  monopolize_luxury_goods_desc:0 "对于苏联官僚来说，进口的珠宝首饰，乌拉尔山外的皮草，高加索的红酒，是生活的不可或缺的一部分。我们无法阻止他们追求富足的生活，但至少，我们应该对这些商品进行管控。"

  corruption_invincible_lady_name:0 "腐败：战无不胜的女士"
  corruption_invincible_lady_desc:0 "没有什么比贪污腐败更糟糕，它会腐蚀我们的基础，让我们失去民心，我们的队伍坚决不能有腐败分子，但是到了外面的世界，到了社会，情况就变了，在外面，腐败是一位战无不胜的女士，她填补了所有的权力真空，让新苏联这间千疮百孔的老房子屹立不倒，我们无法根除腐败，这是一个事实，正相反，我们要与这位女士共舞。"

  silver_ring_plan_name:0 "银环计划"
  silver_ring_plan_desc:0 "内务部长认为，与其坐以待毙，不如直抵污染前线，通过振兴诺夫哥罗德地区的城市，建⽴收容机构，重建物流中⼼。恢复北部地区的⽣产，将灾难的影响牢牢的挡在北方之外。"

  medical_relief_team_name:0 "医疗援助队"
  medical_relief_team_desc:0 "普斯科夫，位于污染区的最前线。普斯科河在城中流淌，潺潺流⽔声赋予城市名 字。在危机爆发后，普斯科夫承接了⼤量波罗的海国家的⼯业，以及巨量的难⺠。如此巨大的变化让这座城市经历了疯狂的野蛮生长，但也令当地的医疗系统不堪重负。"

  logistics_reform_name:0 "物流革新"
  logistics_reform_desc:0 "沃洛格达是乌拉尔到彼得格勒的中间站，也是四方物资交通运输的枢纽，后方的援助物资会从这里经过，而列宁格勒的商品也将从这里流出，作为北方振兴举足轻重的保障，也是别洛夫北方巡查的首要目的地之一		"

  refugee_id_verification_name:0 "难民身份证明"
  refugee_id_verification_desc:0 "在诺夫哥罗德，难民和本地居民的人数不相上下，公共机构不堪重负。对难民进行登记是解决难民危机的唯一途径，只有这样，中央才能合理调度资源，解决难民危机。"

  spirit_of_leningrad_name:0 "重申列宁格勒精神"
  spirit_of_leningrad_desc:0 "俄罗斯的明珠，红旗下的革命堡垒，列宁格勒的肉体如今已经被北方的生态灾难侵蚀殆尽，只剩下一副苦苦支撑的弱不禁风的骨骸，但诚如俄罗斯的玫瑰是在坟墓上绽放一样，列宁格勒这副骨骸也将以精神作为燃料，在冰天雪地中点起炫目的烈焰，绽放闪耀的光芒。"

  auction_leningrad_production_name:0 "拍卖列宁格勒生产指标"
  auction_leningrad_production_desc:0 "即使每年无法交付商品，列宁格勒的企业依然能从中央拿到订单，与其让部分人继续白拿中央的补贴，不如让这些没能交付的订单发挥一些作用，只要条件允许，这些订单就能成为手里的商品，而这些通过这些交易得到的资源也将用在更需要的地方。"

  leningrad_reconstruction_committee_name:0 "列宁格勒振兴委员会"
  leningrad_reconstruction_committee_desc:0 "通过拍卖生产指标，我们获得了一部分振兴所急需的资源，剩下的就是通过建立列宁格勒振兴委员会来管理这部分资源，以便将它们用在正确的地方。"

  support_autonomous_communities_name:0 "支持自治社区"
  support_autonomous_communities_desc:0 "尽管国家机器总是希望自己的权力意志贯彻到社会的每一处，但很多时候，很多地方，总是以妥协告终，对于列宁格勒，政府以前的思维惯性显然已经无法适用了，聪明的当局者会与一些经过筛选的，值得信任的自治组织合作，以求社会在特殊条件下的正常运转，"

  militia_patrol_name:0 "民兵纠察队"
  militia_patrol_desc:0 "权力厌恶真空，但权力也并非无所不能，更何况在列宁格勒，在这里，内务部默许了一些可以信任的自治团体的武装来代替一部分治安，只要他们愿意听从警察的安排——尽管这一举措会带来很多的问题，但目前来说，只要不出性质比较严重的事故，内务部也会尽可能睁一只眼闭一只眼。"

  go_to_the_countryside_name:0 "上山下乡运动"
  go_to_the_countryside_desc:0 "维持大学的运转并非意识，列宁格勒的大学生们如今运作了数不清的私人作坊，赚到钱的钱一部分维持生计，一部分用于学校的建设和维护，一部分用于扩大再生产，我们或许可以利用这些小型的，没有经营许可证的实体来作为城市发展的一部分，问题就是在于这些作坊理论上都是不合规的。\n碰巧的是，近几年北方倒闭了大量公营或私营的乡镇企业，我们或许可以让这些企业“死而复生”。"

  women_union_special_office_name:0 "妇联特别办事处"
  women_union_special_office_desc:0 "员工和企业的矛盾在苏联并非不存在，而如今日益严重的难民危机，生态灾难和经济衰落显然加重了矛盾的程度和影响。在调节过程中，不仅要考虑到多方利益的诉求和物质联系，还要尽量满足并保障北方振兴计划的推进，在多次协商之后，我们决定先从妇女和儿童入手。"

  worker_peasant_soldier_unity_name:0 "工农兵大团结"
  worker_peasant_soldier_unity_desc:0 "工农兵大团结，这句话放在如今的苏联听起来似乎有些“过时”，但值得思考的是，别洛夫通过在北方因地制宜的放权和对官僚制度的对抗，通过在国家机器和民间自发团体中寻求权力的平衡，反而在某种意义上实现了工农兵的团结，尽管没有人知道这样的团结会对未来造成什么样的影响。"

  death_not_proletariat_name:0 "死亡，不属于工人阶级"
  death_not_proletariat_desc:0 "银环计划成功，列宁的精神永流传！"

  military_and_bureaucracy_name:0 "军队与官僚"
  military_and_bureaucracy_desc:0 "对于主席来说，别洛夫在北方州获得的成功属于意料之外，看来在重压之下官僚愿意作出改变。但是，主席真正在乎的，还是由泽林斯基推动的内部整肃工作。毫无疑问，两人大胆的行动撼动了腐朽的体系，如何确保改革一以贯之，是主席要考虑的问题。"

  consolidate_gold_ring_achievements_name:0 "巩固金环计划成果"
  consolidate_gold_ring_achievements_desc:0 "在特定地区雷厉风行推行政策，对于一个集权的中央政府来说并不难。但如何刀锋向内，进行自上而下的改革？这个问题一直困扰着主席。
  \n苏联进行了三场战争，每一场都是大获全胜，每一场都重塑国家体系。整个国家已经被绑上了扩张的战车，所有部门都为了军队服务，经济发展陷入停滞，人民生活水平止步不前。
  \n国家需要改革，总有人要拉动火车的刹车。"

  establish_logistics_coordination_committee_name:0 "成立后勤协调委员会"
  establish_logistics_coordination_committee_desc:0 "军队从来是一个独立体系，从装备生产到安置退伍老兵，军队的一切事务由国防部决定。国防部的唯一工作就是确保：“战必应，战必胜。“从这个角度来说，国防部忠实的完成了使命。
  \n但是，过去二十年的先军策略造成了一系列问题，过度扩张的军队规模榨干了苏联青年，同时退伍士兵的安置也成为了沉重负担；国家经济因为军费开支陷入停滞，而军队大批订单又破坏了商品经济。
  \n主席认为，有必要对削减军队规模与预算，将资源分配给更有活力的经济部门。但这一切，必须慢慢改变，避免出现社会动荡。"

  appease_military_dissatisfaction_name:0 "安抚军队不满情绪"
  appease_military_dissatisfaction_desc:0 "占位符"

  assign_officers_to_state_owned_name:0 "向国企派驻官员"
  assign_officers_to_state_owned_desc:0 "泽林斯基相信，只有强力的监管，将一切置于自己的掌控之中，才能将苏联拉出腐化堕落的深渊。
  \n诚然，苏联存在系统性的腐败，其规模和影响空前绝后，单靠克格勃进行自上而下的改革，是不可能的。但是，腐败本身也是一种秩序，是对现有体系空白的补充。
  \n泽林斯基希望，自己能控制这股力量，在自己超然于外的基础上，成为腐败系统的受益人。为此，他作出决定，向各个企业派驻克格勃人形。"

  consensus_on_market_economy_name:0 "就市场经济的几点共识"
  consensus_on_market_economy_desc:0 "占位符"

  appoint_inspectors_name:0 "选调检查官"
  appoint_inspectors_desc:0 "原则上来讲，国家安全局并不负责起诉官员，打击腐败，监控经济活动。但是作为国家重要的情报机关，契卡的继任者，克格勃对国内事务的干预已经形成惯例。
  \n目前对于主席来说，扩大克格勃权力，给予他们诉讼官员的权力，是完成改革重要的一步。这样，克格勃在执行任务时，就不必受制于漫长的司法流程，可以给予腐败官员最直接的打击。"

  establish_economic_corruption_office_name:0 "设置经济腐败办事处"
  establish_economic_corruption_office_desc:0 "占位符"

  best_officer_in_soviet_name:0 "全苏维埃最杰出的官僚"
  best_officer_in_soviet_desc:0 "路线正确，办事高效，泽林斯基在反腐上不遗余力，不仅赢得了总书记的青睐，更引来同僚形形色色的目光，但那又怎样呢？泽林斯基同志为国家做出的贡献，将作为我们政权稳定的重要保障，全苏维埃最杰出的官僚，实至名归。"

  add_buget_for_KGB_name:0 "丰厚的奖励：国家安全局新增预算"
  add_buget_for_KGB_desc:0 "事实证明，没有明确方针的改革推行起来只会是一地鸡毛。好在泽林斯基是一位足够优秀的官僚。他通过自己的手段，或威逼，或利诱，把大大小小的官员暂时绑在同一辆战车上。\n当前，在苏维埃全国会议召开之前，主席没有办法推行任何政策，他必须依靠泽林斯基这样的能吏，帮助自己度过危机，而泽林斯基完美的执行了任务，主席决定给泽林斯基嘉奖，没有什么比更大的权力，更多的预算更能满足泽林斯基的胃口了。"

  promote_silver_ring_scheme_name:0 "推广银环计划方案"
  promote_silver_ring_scheme_desc:0 "银环计划的成功实属预料之外，主席对别洛夫的表现赞赏有加。但只有稍加研究，就会发现银环计划本身漏洞百出，并不适合在全国推广。主席决定开展一系列宣传活动，在雪藏之前物尽其用，为来年的苏共代表大会打下基础。"

  launch_nationwide_discussion_name:0 "开展全国大讨论"
  launch_nationwide_discussion_desc:0 "在主席的指示下，各路媒体的火力全开，开始了大张旗鼓的宣传，引发了全国大讨论。主席知道，银环计划的种种政策经不起考验，就结果来说，这套方案取得了不错的成效，功大于过，所有人不得不承认这点。更重要的是，这次全国大讨论给力人们一种言论自由的错觉，好像他们真的成为了国家的主人。这样的发展，有利于来年苏共代表大会的顺利举办。"

  share_success_stories_name:0 "宣讲成功经验"
    share_success_stories_desc:0 "在主席的安排下，别洛夫被邀请到各个大学，公共场所进行报告。别洛夫认为这是一个推广银环计划成功经验的好机会，但是很多报告还没有完成，于是，别洛夫决定带着人形进行演讲，分享第一手资料。"

  thunderous_but_feeble_reform_name:0 "“雷声大，雨点小”的改革"
  thunderous_but_feeble_reform_desc:0 "主席作出重要批示，高度赞扬了别洛夫在列宁格勒的工作，宣布联邦北部的重建工作已经初见成效，为未来经济发展打下重要基础。\n针对全国大讨论中暴露的问题，主席表示银环计划是特殊环境下的产物，在非常时期使用非常手段是可以接受的。为了维护党内纪律，主席表示，在下一个五年计划里不会再有这样的单列计划。"
