 fundamentalism_desc:0 "神权政体"

 orthodox_communism:0 "原教旨共产主义"
 orthodox_communism_desc:0 "即便是在共产主义者刚刚成功建立起属于自己的国家的20世纪，全世界的革命家们无一不面临着这样一个事实：马克思与列宁的思想不能完整地套用至自己的土地上。这或是因为时局的更替，或是因为当地某种无奈的现实。于是他们针对自己所面临的局面，充分发挥了主观能动性，创造出了这样或那样的“土豆炖牛肉”式共产主义。\n\n然而原教旨共产主义者并不认同这种变化，他们认为对时局的妥协无异于向魔鬼出卖自己的灵魂，而要在现实中真正建立一个幸福且可持续的共产主义乌托邦，就必须抵制这种诱惑。"
 red_military_government:0 "红色军政府"
 red_military_government_desc:0 "红色军政府由革命军官、政治委员与战时委员会共同掌权，以前线纪律管理配给、净化和人形部队，并宣称军管只是保卫社会主义重建的必要阶段。"
 left_eurasianism:0 "左派欧亚主义"
 left_eurasianism_desc:0 "左派欧亚主义主张把欧亚大陆的铁路、净化带、工业区和安全区纳入统一的社会主义规划，以跨国共同体取代旧民族国家在灾后环境中的无效竞争。"
 neo_strasserism:0 "新斯特拉瑟主义"
 neo_strasserism_desc:0 "新斯特拉瑟主义将激进反资本主义、民族动员和领袖政治重新包装为战后革命方案，敌视跨国金融与寡头企业，却保留高度集权和排他性的群众组织。"
 security_socialism:0 "安保社会主义"
 security_socialism_desc:0 "安保社会主义认为坍塌污染、渗透行动、失控人形与私人武装使国家安全成为一切社会政策的前提，因而赋予情报机关和内部保卫系统广泛的经济与政治权限。"
 technocratic_communism:0 "技官共产主义"
 technocratic_communism_desc:0 "技官共产主义依靠工程师、规划专家与计算系统分配稀缺资源，试图用可验证的生产和净化指标取代派系斗争，同时坚持关键设施归全社会所有。"
 military_political_communism:0 "军政共产主义"
 military_political_communism_desc:0 "在建立列宁式政党与先锋队的斗争当中，有一伙人选择了革命最直接也最为暴力的伙伴——士兵与军官们。\n\n诚然，掌握了国家暴力手段的士兵们并非建设共产主义国家的最优人选，但对于这世界上的很多国家与非国家政权来说，只有军队，只有经历了红色教育，政治可靠的军队能够保护革命的火苗，带领共产主义政党以继续存续。\n\n许多批评者认为摆在军政共产主义与军政府之间的，只有一条细细的丝线，而一昧地依靠军队，只会令国家在和平降临时，坠入万劫不复的深渊，然而，批判毕竟无法胜过武器。"
 left_wing_terrorism:0 "左翼恐怖主义"
 left_wing_terrorism_desc:0 "1969年，出于对越南战争与尼克松总统的愤怒，威廉·鲍威尔创作了饱受争议的著作《无政府主义厨房手册》，其中包含了一位意欲反对政府的暴力分子从制作炸弹到发动袭击所需要的一切，而就几乎在同一时间，日本全共斗运动的兴起，与一直持续的北爱尔兰共和军的城市游击战，彻底奠定了所谓“革命恐怖主义”的一切。\n\n左翼恐怖主义被大部分人认为是日本全共斗运动的进一步发展，特别是在当今新日本企业特区中的城市游击队猖獗的情况下，然而，这一以绝对的暴力手段对抗一切反革命分子与潜在反革命分子的行为，又不仅仅只能见于新日本，在美国二次内战时期，乃至于那些秩序崩乱的南美与非洲城市，都可见这些革命者引发的大爆炸。"
 frontier_communism:0 "边疆共产主义"
 frontier_communism_desc:0 "边疆共产主义产生于污染带边缘的工事、矿区和移民聚落，依靠武装合作社、共同配给与集体净化维持生存，并对遥远中央和绿区精英保持警惕。"
 anarcho_communism:0 "无政府共产主义"
 anarcho_communism_desc:0 "无政府共产主义主张由自治公社和互助网络直接管理生产与安全，反对国家、公司或军队垄断人形与基础设施，并要求人类和具备人格的人形平等参与共同体。"
 automated_communism:0 "自动化共产主义"
 automated_communism_desc:0 "自动化共产主义认为成熟的人形劳动、智能物流和无人生产能够消除匮乏，由公共算法协调生产与分配，使人类和人形摆脱被迫劳动与私人占有。"

 fundamental_fascism:0 "原教旨法西斯主义"
 fundamental_fascism_desc:0 "原教旨法西斯主义拒绝战后温和化，要求以领袖崇拜、单一政党、民族净化和永久动员重建国家，并把污染区战争视为筛选忠诚与力量的熔炉。"
 zionist_fascism:0 "锡安法西斯主义"
 zionist_fascism_desc:0 "锡安法西斯主义把民族家园的存续置于一切权利之上，以军事化定居、人口管制和强制统一回应污染、流亡与安全危机，并排斥多元政治对国家使命的限制。"
 neo_nazism:0 "新纳粹主义"
 neo_nazism_desc:0 "新纳粹主义继承种族等级、极端民族主义和扩张主义，以坍塌灾难后的生存竞争为其伪科学辩护，并企图用现代监控与自动化武装实现总体控制。"
 extreme_militarism:0 "极端军国主义"
 extreme_militarism_desc:0 "极端军国主义将国家视为一座永不停战的兵营，社会生产、教育、人形研发和净化工程都必须直接服务于军队及领土扩张。"
 military_political_fascism:0 "军政法西斯主义"
 military_political_fascism_desc:0 "军政法西斯主义由军官团与法西斯政党共同统治，利用群众组织提供政治忠诚，以军队和人形战斗群提供强制力，并消除文官体系的独立性。"
 criminal_state:0 "罪犯国度"
 criminal_state_desc:0 "罪犯国度由走私网络、地方帮派、腐败官僚和私人武装瓜分权力，依靠污染区物资、非法人形交易与保护费维持统治，再用民族主义仪式包装其掠夺秩序。"
 co_governance:0 "共治主义"
 co_governance_desc:0 "共治主义允许党、军队、大企业与安全机关作为特许集团共同分享权力，由最高领袖仲裁彼此冲突，以集团合作而非公民代表构成国家。"

 anarcho_technocracy:0 "无政府技官主义"
 anarcho_technocracy_desc:0 "这种诡异的思想源流糅合了克鲁泡特金互助论与21世纪技术开源运动，提出通过分布式技官节点实现去国家化的社会自治。其运作机制依托基层单元自主治理与物物交换体系，中央仅保留跨单元协调职能。相比常见的无政府主义，其理论体系不拒绝组织，不拒绝理性权威，不拒绝规模，转而要求技术去暴力化、专家草根化与资源反稀缺化。\n\n尽管技官无政府主义者宣称自己也是安娜其妈妈最喜爱的孩子之一，并且是庞大的无政府主义家族中最可能实现的那一个，但就绝大多数的安娜其理论家来说，这绝非他们的族类。"
 bolivarianism:0 "玻利瓦尔主义"
 bolivarianism_desc:0 "玻利瓦尔主义将拉丁美洲的民族独立、区域团结与社会改革结合起来，主张以公共主导的经济和群众政治抵抗外部控制，并推动各国在平等基础上开展合作。"
 christian_socialism:0 "基督教社会主义"
 christian_socialism_desc:0 "基督教社会主义以人的尊严、互助与共同责任回应战后贫困，要求教会、合作社和公共机构共同照顾难民、伤员及被遗弃的人形。"
 left_nationalism:0 "左翼民族主义"
 left_nationalism_desc:0 "左翼民族主义把民族独立与社会所有制结合起来，反对外国军队、跨国企业和私人军事承包商控制本国安全区及净化资源。"
 left_revivalism:0 "左翼复兴主义"
 left_revivalism_desc:0 "左翼复兴主义认为旧世界已随北兰岛灾难和大战终结，必须通过激进平等、公共动员与新型人形劳动制度实现文明的第二次诞生。"
 market_socialism:0 "市场社会主义"
 market_socialism_desc:0 "市场社会主义允许合作社和公共企业在受监管市场中竞争，但土地、净化设施、核心算法与人形基础工业不得成为少数寡头的永久财产。"
 syndicalism:0 "工团主义"
 syndicalism_desc:0 "工团主义由行业联合会和劳动者代表管理生产，主张工人、技术人员与具备人格的人形共同控制工厂、物流线路和地方防卫力量。"
 popular_front:0 "人民阵线"
 popular_front_desc:0 "人民阵线联合社会主义者、工会、进步派与反法西斯力量，把保卫安全区、恢复公共服务和阻止军阀夺权置于派系理论分歧之前。"
 indian_communism:0 "印度共产主义"
 indian_communism_desc:0 "印度共产主义把土地改革、反种姓压迫、村社自治和公共工业化结合起来，试图在巨大人口压力与污染迁徙中建立适合南亚社会的社会主义道路。"

 frontier_progressivism:0 "边疆进步主义"
 frontier_progressivism_desc:0 "边疆进步主义要求将污染边缘居民纳入完整公民体系，通过公共医疗、净化投资、铁路和人形救援队缩小绿区与黄区之间的权利差距。"
 left_populism:0 "左翼民粹主义"
 left_populism_desc:0 "左翼民粹主义把普通民众与难民描述为重建国家的真正主体，反对绿区寡头、腐败承包商和脱离监督的官僚，但仍依靠选举争取权力。"
 democratic_socialism:0 "民主社会主义"
 democratic_socialism_desc:0 "民主社会主义通过议会、选举和独立工会推动社会所有制与福利改革，拒绝以永久紧急状态为理由取消政治竞争。"
 humanitarian_capitalism:0 "人道资本主义"
 humanitarian_capitalism_desc:0 "人道资本主义保留私有企业和市场竞争，同时要求企业承担公共服务、劳动保障与污染救济责任，以社会投资和人道标准约束资本扩张。"
 christian_social_democracy:0 "基督教社会主义"
 christian_social_democracy_desc:0 "基督教社会主义以人的尊严、社会互助和民主责任为原则，主张通过议会、教会慈善网络、工会与公共机构共同保护难民、劳动者及具备人格的人形。"
 left_agrarianism:0 "左翼农业主义"
 left_agrarianism_desc:0 "左翼农业主义以农民合作社、土地再分配和生态修复为核心，要求净化后的土地优先交给当地共同体，而非大企业或军事殖民机构。"
 great_plains_rossartrism:0 "大平原罗克萨特主义"
 great_plains_rossartrism_desc:0 "大平原罗克萨特主义把跨境农业带、净化走廊和移民安置视为共同工程，主张以民主协商推进罗克萨特式国际整合，逐步削弱国界对资源恢复的阻碍。"

 populist_conservatism:0 "民粹保守主义"
 populist_conservatism_desc:0 "民粹保守主义号召普通家庭、退伍军人与地方社区对抗绿区精英，强调传统秩序、边境安全和本国居民对稀缺净化资源的优先权。"
 middle_way:0 "中间路线"
 middle_way_desc:0 "中间路线主张在市场活力、社会保障、地方自治与联邦秩序之间维持务实平衡，以渐进改革修复污染时代的制度裂痕，拒绝任何一方垄断国家重建。"
 traditional_patriotism:0 "传统爱国主义"
 traditional_patriotism_desc:0 "传统爱国主义将民族历史、家庭伦理、宗教习俗与国家忠诚视为社会凝聚力的根基，主张以保守改革和公民义务维护共同体，反对以激进革命割裂传统。"
 right_revivalism:0 "右翼复兴主义"
 right_revivalism_desc:0 "右翼复兴主义把战后衰败归因于旧精英的软弱，试图借助民族传统、宗教伦理、纪律和私人企业重建一个强健而统一的社会。"
 oligarchic_liberalism:0 "寡头自由主义"
 oligarchic_liberalism_desc:0 "寡头自由主义维护市场、契约和形式法治，却默认大型企业、金融集团与安全区所有者对政治拥有决定性影响，并将这种集中视为稳定投资所必需。"
 liberal_corporatism:0 "自由法团主义"
 liberal_corporatism_desc:0 "自由法团主义让工会、企业、专业团体与地方政府在宪政框架内协商政策，试图用制度化合作管理人形替代、重建投资和劳资冲突。"
 christian_conservatism:0 "基督教保守主义"
 christian_conservatism_desc:0 "基督教保守主义以信仰、家庭和慈善共同体维持战后社会纽带，支持有限改革，但反对国家或企业以技术效率为名拆解传统伦理。"

 progressive_liberalism:0 "进步自由主义"
 progressive_liberalism_desc:0 "进步自由主义在维护个人权利和市场交换的同时，主张以反歧视、公共教育及透明监管回应难民、人形人格和污染区居民面临的新型不平等。"
 constitutional_liberalism:0 "宪政自由主义"
 constitutional_liberalism_desc:0 "宪政自由主义要求政府、军队、情报机关与私人军事企业均受成文宪法和独立司法约束，任何紧急状态都不得无限期悬置公民权利。"
 anarcho_capitalism:0 "无政府资本主义"
 anarcho_capitalism_desc:0 "无政府资本主义希望以私人契约、公司辖区和商业仲裁取代国家，在污染边疆尤其依赖私人军事企业与付费净化服务维持秩序。"
 liberal_conservatism:0 "自由保守主义"
 liberal_conservatism_desc:0 "自由保守主义结合有限政府、市场经济和渐进社会改革，既维护个人自由，也强调传统制度在文明重建中的连续性。"
 liberal_technocracy:0 "自由技官主义"
 liberal_technocracy_desc:0 "自由技官主义主张由专业机构依据公开数据管理净化、城市规划和人形安全标准，同时以权利法案、审计制度和竞争市场限制技术官僚的权力。"

 constitutional_rossartrism:0 "宪政罗克萨特主义"
 constitutional_rossartrism_desc:0 "宪政罗克萨特主义支持以超国家宪章整合边境、资源和净化工程，建立强有力的联合行政机关，但要求其权限、成员权利与权力移交程序受到成文规则约束。"
 persian_rossartrism:0 "波斯罗克萨特主义"
 persian_rossartrism_desc:0 "波斯罗克萨特主义将罗克萨特式超国家整合移植到伊朗高原，主张由强势国家统合波斯各民族、坍塌污染区、交通走廊与人形工业，并以文明共同体的名义压制地方分离和党派竞争。"
 south_american_rossartrism:0 "南美洲罗克萨特主义"
 south_american_rossartrism_desc:0 "南美洲罗克萨特主义主张跨越南美各国边界统一管理净化走廊、企业特区和基础设施，以区域行政整合取代彼此竞争的民族国家体系。"
 broad_rossartrism:0 "广泛罗克萨特主义"
 broad_rossartrism_desc:0 "广泛罗克萨特主义以跨地区行政协调、共同市场和统一净化政策为核心，允许不同政治集团在超国家框架内合作，并逐步把主权职能转移给联合机构。"
 corporate_council:0 "企业委员会"
 corporate_council_desc:0 "企业委员会由掌握工业、人形制造、物流和安全合同的企业代表共同执政，以投资能力和技术贡献而非普选授权分配政治席位。"
 non_dominant_system:0 "无支配体制"
 non_dominant_system_desc:0 "无支配体制刻意维持官僚、军队、企业与地方权力之间的平衡，不允许任何集团完全控制国家，却也拒绝把最高决策直接交给大众政治。"
 guardian_authoritarianism:0 "监护式威权主义"
 guardian_authoritarianism_desc:0 "监护式威权主义声称民主体制尚不足以应对污染和重建危机，由自命为监护者的精英暂时代行政治权利，并以未来恢复正常秩序作为合法性来源。"
 sharia_democracy:0 "沙里亚民主"
 sharia_democracy_desc:0 "沙里亚民主在宗教法框架内保留选举、议会与有限的政治竞争，由教法学者监督立法和行政是否符合信仰原则。"

 absolute_monarchy:0 "绝对君主制"
 absolute_monarchy_desc:0 "绝对君主制把主权集中于世袭君主及其宫廷，军队、土地、净化资源和人形武装均被视为王权直接支配的国家资产。"
 theocracy:0 "神权制"
 theocracy_desc:0 "神权制宣称北兰岛事件、坍塌辐射与战后浩劫证明世俗秩序已经失去正统，由宗教领袖垄断立法与行政权；军队、净化设施及战术人形皆被置于教法监督之下，以启示而非民意决定国家方向。"
 military_state:0 "军队国家"
 military_state_desc:0 "军队国家并非由军人临时接管，而是把整个社会永久编入国防体系；行政区、企业、学校和人形生产线都按战略需要组织。"
 transitional_government:0 "过渡政府"
 transitional_government_desc:0 "过渡政府以战争结束、政权崩溃或污染撤离为由集中权力，承诺在完成治安恢复、人口登记和基础设施重建后移交政权。"
 military_junta:0 "军政府"
 military_junta_desc:0 "军政府由高级军官委员会直接统治，依靠戒严、配给和军事法庭控制政治，并把正规军及人形部队视为国家唯一可靠的组织基础。"
 right_technocracy:0 "右翼技官主义"
 right_technocracy_desc:0 "右翼技官主义将技术效率、私有工业和国家竞争置于政治平等之上，由工程师、经理人与安全专家共同决定资源配置。"
 command_technocracy:0 "指令技官主义"
 command_technocracy_desc:0 "指令技官主义把国家建设成由中央模型、专家委员会和自动化行政系统驱动的命令机器，公民与人形都被视为可计算、可调度的治理单元。"
 party_rossartrism:0 "党权罗克萨特主义"
 party_rossartrism_desc:0 "党权罗克萨特主义由单一政党垄断罗克萨特主义的解释权，以净化工程、跨国合并和统一安全体系为使命，并把反对力量视为阻碍人类联合的地方主义残余。"
 guided_democracy:0 "指导式民主"
 guided_democracy_desc:0 "指导式民主保留选举和议会，但候选资格、媒体议程与政策边界由行政机关预先限定，以确保政治竞争不会动摇安全、净化和国家统一。"
 league_authority_rossartrism:0 "盟权罗克萨特主义"
 league_authority_rossartrism_desc:0 "盟权罗克萨特主义主张由罗克萨特主义联盟集中掌握成员国的安全、外交、资源调配与战略工业，以统一权威压制地方派系和主权争议，并把联盟存续置于成员自治之上。"
 national_authoritarian_integralism:0 "民族威权统合主义"
 national_authoritarian_integralism_desc:0 "民族威权统合主义把国家描述为超越个人和阶级的有机整体，要求地方、行业、军队与人形组织接受统一等级秩序及民族使命。"

 esoteric_theocracy:0 "密传神权"
 esoteric_theocracy_desc:0 "密传神权由掌握封闭教义的祭司集团统治，将遗迹、坍塌现象或人形心智解释为神圣秩序的证据，并以宗教资格决定政治权利。"
 esoteric_despotism:0 "密传专制主义"
 esoteric_despotism_desc:0 "密传专制主义把秘密知识集中于统治者和少数内环成员，以不可公开验证的启示解释灾难与权力，使国家命令同时具有政治和宗教强制性。"
 mysticism:0 "神秘主义"
 mysticism_desc:0 "神秘主义认为遗迹技术、坍塌辐射和人形意识揭示了超越现代科学的实在，政治共同体应依照象征、预言和灵性经验重新组织。"
