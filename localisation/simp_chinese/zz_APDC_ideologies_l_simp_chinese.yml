 communism_desc:0 "极权政体"
 fascism:0 "法西斯主义"
 fascism_noun:0 "法西斯主义"
 fascism_desc:0 "极权政体"
 socialism:0 "社会主义"
 socialism_noun:0 "社会主义"
 socialism_desc:0 "社会主义政体"
 social_democracy:0 "社会民主主义"
 social_democracy_noun:0 "社会民主主义"
 social_democracy_desc:0 "民主政体"
