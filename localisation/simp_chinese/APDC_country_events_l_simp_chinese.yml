 APDC_event_Title_debug_1:0 "测试事件"
 APDC_events_trigger.1.t:0 "测试事件"
 APDC_event_first_desc_debug_1:0 "——欢迎收看时事聚焦。我是夏朵利兹，接下来为您报道最新时事。\n克劳茨委员一行抵达了北奥塞梯-阿兰共和国，并出席别斯兰事件遇难者纪念月活动。克劳茨委员慰问了遇难者家属，他表示:恐怖主义活动仍然是世界各国面临的首要安全问题。我方愿意同苏方一道帮助北奥塞梯•阿兰共和国推进反恐力量建设，共同为促进世界和平与稳定而努力。\n外交部发言人今日表示:鉴于苏方局势趋稳，我国正考虑派遣特使前往，就继续促进两国技术与环境领域合作进行磋商。此前，由苏方提供技术支持的净化装置在柏林试验区完成了第二次净化测试，而本次合作将继续完成净化装置的后续指标，以期能够早日完成测试并投入使用。\n不莱梅难民安置区内因不明爆炸造成的火灾已被控制。据安全部门消息，当日有大量武装人员进入难民安置区维持秩序，对此，不莱梅政府呼吁民众不要轻信谣言。目前难民安置工作已在稳步进行中，不莱梅市市长亲到一线指挥。\n泛欧联盟理事会乌尔利赫主席秘书默莉朵在不莱梅境内失联，现仍在搜寻中。"
 APDC_event_second_desc_debug_1:0 "\n目前默莉朵秘书的居所已被不莱梅警方封锁调查，乌尔利赫主席表示将积极配合。此前有消息指出，默莉朵秘书失联之前曾现身不莱梅难民安置区，但相关人士表示此次公务与失踪事件无关。\n以上就是今天的新闻内容——民主德国广播电视台为您报道。"
 APDC_event_option_a_desc_debug_1:0 "§W有趣，社会学+3§!"
 APDC_event_Title_debug_2:0 "第二个测试事件"
 APDC_events_trigger.2.t:0 "第二个触发事件"
 APDC_event_first_desc_debug_2:0 "404小队的成员，沉默寡言的人形。只有在同伴面前话语会多一些，往往也都是毒舌。和冰冷的性格相反，运动和反射非常出色。自我意识极端过剩，坚信自己是作战能力最出色的人形。不过在同伴面前很可靠，也信任身为领袖的UMP45。由于404小队的处境不佳，十分嫉妒条件相对优越的AR小组，尤其是看起来没什么烦恼的M16A1和事事纠结的M4A1。"
 APDC_event_option_a_desc_debug_2:0 "有416就够了"
