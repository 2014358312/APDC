GFCC_area_security_modifiers_desc: "安全度_desc\n当前地区安全度$GFCC_area_security_var$：$RIGHT|=%1$\n"
GFCC_area_security_modifiers_1: "§G完全可控§!"
GFCC_area_security_modifiers_2: "§G基本安全§!"
GFCC_area_security_modifiers_3: "§Y可控§!"
GFCC_area_security_modifiers_4: "§Y一般§!"
GFCC_area_security_modifiers_5: "§R危险§!"
GFCC_area_security_modifiers_6: "§R高危§!"
GFCC_area_security_modifiers_7: "§O失控§!"
GFCC_area_security_modifiers_1_desc: "地区社会秩序良好，治安稳定，基础设施完善，居民生活安全无忧。"
GFCC_area_security_modifiers_2_desc: "地区整体安全，偶有轻微治安事件，不影响正常生产生活。"
GFCC_area_security_modifiers_3_desc: "地区存在一定治安隐患，犯罪率有所上升，但尚在可控范围。"
GFCC_area_security_modifiers_4_desc: "地区治安状况一般，犯罪活动增多，居民安全感下降。"
GFCC_area_security_modifiers_5_desc: "地区陷入危险状态，暴力冲突频发，正常秩序难以维持。"
GFCC_area_security_modifiers_6_desc: "地区处于高危状态，社会秩序濒临崩溃，仅有少量武装力量维持。"
GFCC_area_security_modifiers_7_desc: "地区完全失控，无政府状态，陷入无秩序的混乱之中。"

