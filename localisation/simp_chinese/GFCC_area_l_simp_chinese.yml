GFCC_area_reconstruction_modifiers_1_desc: "地区基础设施与建筑已完全重建，恢复至战前水平。"
GFCC_area_reconstruction_modifiers_2_desc: "地区重建基本完成，仅有少量设施尚待修复。"
GFCC_area_reconstruction_modifiers_3_desc: "地区大部分设施已完成重建，仍有部分区域受损。"
GFCC_area_reconstruction_modifiers_4_desc: "地区部分设施得到重建，但大量建筑仍处于损毁状态。"
GFCC_area_reconstruction_modifiers_5_desc: "地区重建工作正在进行，基础设施逐步恢复。"
GFCC_area_reconstruction_modifiers_6_desc: "地区刚开始重建，损毁痕迹依然明显。"
GFCC_area_reconstruction_modifiers_7_desc: "地区基础设施严重损毁，生产生活受到严重影响。"
GFCC_area_reconstruction_modifiers_8_desc: "地区已成为一片废墟，几乎没有任何完好的设施。"

