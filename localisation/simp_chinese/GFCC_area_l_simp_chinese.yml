GFCC_area_Pollution_modifiers_1_desc: "被绿区包围、经过严格净化或从未受污染的区域的核心安全区，受当地政府严格控制，生活条件最好。"
GFCC_area_Pollution_modifiers_2_desc: "受到轻微污染、经过人工净化或自然恢复的区域，是人类幸存者主要的居住地。拥有相对稳定的社会秩序和补给设施。"
GFCC_area_Pollution_modifiers_3_desc: "正在通过“净化塔”等技术进行治理的过渡区域或隔离区。"
GFCC_area_Pollution_modifiers_4_desc: "植被变异，天空呈现浑浊色。存在特殊的生态现象（如“坍塌昙花”）。虽然人类可以短期生存，但长期暴露仍需防护。常有非法分子游荡的过渡地带。"
GFCC_area_Pollution_modifiers_5_desc: "呈现沙漠化或焦土地貌，伴有周期性的辐射风暴。充斥着高变异的E.L.I.D.感染体，通常被认为无法长期生存。"
GFCC_area_Pollution_modifiers_6_desc: "辐射源头，地表残留大量古代遗迹。生还率极低，普通人类无法生存，只有高度改造的人形或特殊装备才能短暂进入。"

