l_simp_chinese:
 LOADING_TIP_0:0 "我认为每年不幸付出一些枪支死亡的代价以换取第二修正案的保护是值得的，这样我们才能保留第二修正案，用以保护我们其他由上帝赋予的权利，这是一笔审慎，理性的交易。\n——查理·柯克"
 LOADING_TIP_1:0 "我爱你，如果你觉得奇怪为何我没有理由地爱你，我想说，如果世界上有无缘无故的恨，那为何没有无缘无故的爱呢？\n——店面小贴条"
 LOADING_TIP_2:0 "如果来生有劳作，那你须替我受其劳。一旦我有所召唤，你须立刻回应。在此劳作之时须谨言慎行。耕我之田，将水和沙运往东西四方。一旦我有所召唤，你须立刻回应。\n——埃及夏勃梯人像铭文"
 LOADING_TIP_3:0 "指挥官，我把你的死亡带到了。\n——代理人"
 LOADING_TIP_4:0 "我能恳求你以赞许的目光看待你的造物吗？我在此祈求你的善良与恻隐之心。\n——玛丽·雪莱《弗兰肯斯坦》"
 LOADING_TIP_5:0 "总有一天会没有边界，没有界限，没有国旗，没有国家，人心将成为唯一的通行证\n——卡洛斯·桑塔纳"
 LOADING_TIP_6:0 "因此，即便山崩地裂，坠入大海，我们毫不惧怕；即使江河沸腾，海枯石烂，我们同样毫不惧怕。\n——旧约《诗篇》46:2-3"
 LOADING_TIP_7:0 "如果你想要树敌，就试试看改变什么东西吧。\n——伍德罗·威尔逊"
 LOADING_TIP_8:0 "去求知吧，哪怕远在中国\n——阿拉伯谚语"
 LOADING_TIP_9:0 "我们选择研究遗迹，不是因为简单，而正是因为那困难重重\n——约翰·F·肯尼迪"
 LOADING_TIP_10:0 "指挥官，你是要先吃饭，还是先洗澡，还是……先买东西！\n——格琳娜"
 LOADING_TIP_11:0 "没有，滚吧。\n——马卡洛夫"
 LOADING_TIP_12:0 "我自杀算了。\n——RO635"
 LOADING_TIP_13:0 "我现在只剩下两个弹匣。\n——AK-15"
 LOADING_TIP_14:0 "南极太冷了，所以我没去。\n——L博士"
 LOADING_TIP_15:0 "餐后甜点：肉桂卷（被划掉）。\n——S09区食堂餐谱"
 LOADING_TIP_16:0 "藏好烈酒！！！\n——S09区酒柜上的便签"
 LOADING_TIP_17:0 "你是说......我其实是巴西海军的最高指挥？\n——雅各布·劳埃德·奈杰尔·埃斯普林"
 LOADING_TIP_18:0 "我们新世界再见吧。\n——莱特"
 LOADING_TIP_19:0 "历史由胜利者书写，史书如何记载我们，取决于谁活到最后。\n——叶戈尔·阿尔卡季耶维奇·别列捷夫"
 LOADING_TIP_20:0 "谢谢你，罗宾。\n——玛赫莲"
 LOADING_TIP_21:0 "他们绝对不会把祖国交给西方，到最后的时刻，我们会清除所有卖国贼，祖国……\n万岁……\n——叶戈尔·阿尔卡季耶维奇·别列捷夫"
 LOADING_TIP_22:0 "和格里芬合作，是为了测试未来联合作战的模式。如果你继续散播谣言，我会以危害国家安全的罪名逮捕你。\n——卡特·彼得诺维奇·诺伊施塔特"
 LOADING_TIP_23:0 "我不是个爱做梦的人，我只是做了我想做的而已。\n——伊戈尔·米哈伊洛维奇·亚科夫斯基"
 LOADING_TIP_24:0 "正如我们的先祖们选择踏上这片新世界，今天的我们也将把希望的火种带回大洋彼岸的旧世界。\n——弗朗西斯·内维尔·麦克莱恩"
 LOADING_TIP_25:0 "是的，改革会带来牺牲，原则会带来代价，但这不该是我们做出让步的理由。美利坚，罗克萨特主义的美利坚，前进！\n——谢尔顿·塔马里乌斯·佩里"
 LOADING_TIP_26:0 "未来不虚无，它只是更多人的愿望。\n——切斯·菲利普·范·本瑟姆"
 LOADING_TIP_27:0 "那是海平线上的第一缕曙光，它正撕破乌云，越过浪涛，洒落在这个国家的每一个公民身上。\n——罗伯特·奥尔维尔·汉普顿"
 LOADING_TIP_28:0 "一支火炬，于寂静的午夜熊熊燃起。\n——公开信《我们是美利坚的罗克萨特主义者》，2039年"
 LOADING_TIP_29:0 "隔离墙的那一边是我们的家，是与我们血肉相连的亲人，还有我们魂牵梦萦的故乡。\n——阿比盖尔·伊娃·朗斯顿"
 LOADING_TIP_30:0 "坍塌辐射病从不是罪恶。它是伤痛，将曾经幸福的一个又一个灵魂践踏在脚下，让他们背负苦难的伤痛。\n——艾芙琳·奥蒂纳·莱斯佩朗斯"
 LOADING_TIP_31:0 "终结战争，至少是终结人类参与的战争。\n——安妮·弗洛伦斯·梅勒"
 LOADING_TIP_32:0 "日复一日，希望的温度终将融化无垠的冰雪。\n——尼古拉斯·索耶·温弗莱"
 LOADING_TIP_33:0 "我知道你在做什么，切斯。你有你的信仰和人民，我也有我的。我是不可能让开的。现在，趁场面还没太难看，给我滚。\n——德文·伯斯维尔，于伊利诺伊州议会前的抗议"
